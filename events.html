<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Find events | OpenTickets</title><link rel="stylesheet" href="assets/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="site-header"></div><main id="main"><div class="page-head"><div class="container"><h1 class="mb-3">Find events</h1><form id="search-form" class="d-flex gap-2" role="search"><input id="q" class="form-control form-control-lg" type="search" placeholder="Event, venue or city" aria-label="Search events"><button class="btn btn-ot px-4">Search</button></form></div></div>
<div class="container section"><div class="d-flex justify-content-between align-items-center mb-3 gap-2"><p id="count" class="m-0 fw-semibold" aria-live="polite"></p>
<div class="d-flex gap-2"><button class="btn btn-line d-lg-none" data-bs-toggle="offcanvas" data-bs-target="#filters-panel">Filters</button><label class="visually-hidden" for="sort">Sort</label><select id="sort" class="form-select d-none d-lg-block"><option value="date">Soonest first</option><option value="price-asc">Price: low to high</option><option value="price-desc">Price: high to low</option></select><label class="visually-hidden" for="sort-m">Sort</label><select id="sort-m" class="form-select d-lg-none"><option value="date">Soonest</option><option value="price-asc">Price: low</option><option value="price-desc">Price: high</option></select></div></div>
<div class="row g-4"><div class="col-lg-3"><div class="offcanvas-lg offcanvas-start" tabindex="-1" id="filters-panel" aria-labelledby="fp-title"><div class="offcanvas-header"><h2 class="h5 m-0" id="fp-title">Filters</h2><button class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#filters-panel" aria-label="Close"></button></div><div class="offcanvas-body d-block"><div class="filter-panel">
<fieldset><legend class="fs-6 fw-semibold">Category</legend><div class="form-check"><input class="form-check-input" type="checkbox" name="cat" value="Music" id="c1"><label for="c1">Music</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="cat" value="Sports" id="c2"><label for="c2">Sports</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="cat" value="Shows" id="c3"><label for="c3">Shows</label></div><div class="form-check"><input class="form-check-input" type="checkbox" name="cat" value="Schools" id="c4"><label for="c4">Schools</label></div></fieldset>
<label for="f-month">Date</label><select id="f-month" class="form-select"><option value="">Any month</option></select>
<label for="f-city">Location</label><select id="f-city" class="form-select"><option value="">All cities</option></select>
<label for="f-price">Price</label><select id="f-price" class="form-select"><option value="">Any price</option><option value="0-200">Up to R200</option><option value="201-9999">R201 and up</option></select>
<button class="btn btn-line w-100 mt-3 js-reset">Clear filters</button></div></div></div></div>
<div class="col-lg-9"><div class="ev-grid" id="results"></div><div class="empty" id="empty" hidden><h2 class="h4">No events found</h2><p class="muted">Try changing your search or filters.</p><button class="btn btn-ot js-reset">Reset search</button></div><div class="text-center mt-4"><button class="btn btn-line px-4" id="more" hidden>Load more events</button></div></div></div></div></main>
<div id="site-footer"></div><script src="assets/js/bootstrap.bundle.min.js"></script><script src="assets/js/main.js"></script><script src="assets/js/filters.js"></script></body></html>
