<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | OpenTickets</title><link rel="stylesheet" href="assets/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="site-header"></div><main id="main" class="auth"><div class="container"><div class="auth-card">
<div id="login-box"><h1 class="h2">Log in</h1><p class="muted">Welcome back. Log in to manage your tickets.</p>
<form class="auth-form needs-validation" novalidate data-endpoint="" data-demo="Frontend demo: this form is not connected to a server yet.">
<div class="mb-3"><label for="l-email">Email address</label><input id="l-email" name="email" type="email" class="form-control" autocomplete="email" required><div class="invalid-feedback">Enter a valid email address.</div></div>
<div class="mb-2"><label for="l-pw">Password</label><div class="pw"><input id="l-pw" name="password" type="password" class="form-control" autocomplete="current-password" required><button type="button" data-toggle-pw="l-pw" aria-pressed="false">Show</button></div><div class="invalid-feedback">Enter your password.</div></div>
<div class="d-flex justify-content-between align-items-center mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" id="remember" name="remember"><label class="fw-normal" for="remember">Remember me</label></div><a href="#" id="show-reset">Forgot password?</a></div>
<button class="btn btn-ot w-100" type="submit">Log in</button><div class="auth-msg" hidden role="status"></div></form>
<p class="text-center mt-4 mb-0">New to OpenTickets? <a href="signup.html">Create an account</a></p></div>
<div id="reset-box" hidden><h1 class="h2">Reset password</h1><p class="muted">Enter your email and we will send a reset link.</p>
<form class="auth-form needs-validation" novalidate data-demo="Frontend demo: reset emails are not sent until a server is connected.">
<div class="mb-3"><label for="reset-email">Email address</label><input id="reset-email" name="email" type="email" class="form-control" required><div class="invalid-feedback">Enter a valid email address.</div></div>
<button class="btn btn-ot w-100" type="submit">Send reset link</button><div class="auth-msg" hidden role="status"></div></form>
<p class="text-center mt-4 mb-0"><a href="#" id="back-login">Back to log in</a></p></div>
</div></div></main>
<div id="site-footer"></div><script src="assets/js/bootstrap.bundle.min.js"></script><script src="assets/js/main.js"></script><script src="assets/js/auth.js"></script></body></html>
