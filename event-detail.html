<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event | OpenTickets</title><link rel="stylesheet" href="assets/css/bootstrap.min.css"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css"></head><body><a class="skip" href="#main">Skip to content</a><div id="site-header"></div><main id="main"><div class="container pt-4"><img id="hero-img" class="d-hero w-100" alt="" width="1210" height="450"></div>
<div class="container section pt-4"><div class="row g-4 g-xl-5"><div class="col-lg-8"><p class="muted mb-1 js-cat"></p><h1 class="js-title mb-2"></h1>
<dl class="d-facts"><div data-fact><dt>Date</dt><dd class="js-date"></dd></div><div data-fact><dt>Time</dt><dd class="js-time"></dd></div><div data-fact><dt>Venue</dt><dd class="js-venue"></dd></div><div data-fact><dt>Location</dt><dd class="js-city"></dd></div></dl>
<h2 class="h4 mt-4">About this event</h2><p class="muted" style="max-width:70ch" id="desc"></p>
<section id="venue-sec"><h2 class="h4 mt-4">Venue and location</h2><p class="fw-semibold mb-1 js-venue"></p><p class="muted js-city"></p><a id="map-link" class="btn btn-line" href="#" target="_blank" rel="noopener">Open in maps</a></section></div>
<div class="col-lg-4"><aside class="buy-box" id="tickets" aria-labelledby="tk"><h2 class="h5" id="tk">Tickets</h2><p class="fs-4 fw-semibold js-price mb-2"></p>
<!-- FUTURE: ticket selection -> seat map -> checkout mounts inside #ticket-flow -->
<div id="ticket-flow"><div class="tier"><span>Ticket types and prices</span><span class="muted">See banner</span></div><div class="tier"><span>Seat selection</span><span class="muted">Coming soon</span></div></div>
<button class="btn btn-ot w-100 mt-3" type="button" onclick="alert('Checkout connects here (backend not included).')">Get tickets</button><p class="small mt-3 mb-0 text-center">Need help with this event? <a id="help-link" href="contact.html">Contact Support</a></p></aside></div></div></div>
<section class="section pt-0"><div class="container"><h2 class="mb-3">You might also like</h2><div class="ev-grid ev-grid--3" id="related"></div></div></section></main>
<div class="sticky-cta"><span class="fw-semibold js-price"></span><a class="btn btn-ot" href="#tickets">Get tickets</a></div>
<div id="site-footer"></div><script src="assets/js/bootstrap.bundle.min.js"></script><script src="assets/js/main.js"></script><script>(function(){const e=OT.events.find(x=>x.id==new URLSearchParams(location.search).get("id"))||OT.events[0];document.title=e.title+" | OpenTickets";document.body.classList.add("has-sticky");
const set=(c,v)=>document.querySelectorAll(c).forEach(n=>{n.textContent=v;if(!v){const p=n.closest("[data-fact]");p&&(p.hidden=true)}});set(".js-title",e.title);set(".js-cat",e.cat);set(".js-date",e.dl||(e.date?new Date(e.date+"T00:00").toLocaleDateString("en-ZA",{weekday:"long",day:"numeric",month:"long",year:"numeric"}):""));set(".js-time",e.t||"");set(".js-venue",e.venue||"");set(".js-city",e.city||"");set(".js-price",e.price?"From R"+e.price:"See event banner");
const im=document.getElementById("hero-img");im.src=OT.img(e);im.alt=e.title;document.getElementById("tickets").dataset.eventId=e.id;
if(!e.venue)document.getElementById("venue-sec").hidden=true;else document.getElementById("map-link").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(OT.where(e));
document.getElementById("help-link").href="contact.html?type=Event+Question&event="+encodeURIComponent(e.title);document.getElementById("desc").textContent=e.title+(OT.where(e)?" at "+OT.where(e):"")+". Full event details are shown on the banner above.";
OT.render("#related",OT.events.filter(x=>x.cat==e.cat&&x.id!=e.id).slice(0,3))})()</script></body></html>
